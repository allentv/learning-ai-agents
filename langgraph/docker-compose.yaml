services:
  model-runner:
    provider:
      type: model
      options:
        model: hf.co/unsloth/granite-4.0-h-micro-GGUF:UD-Q4_K_XL
    container_name: model-runner

  app:
    build: .
    container_name: langgraph-app
    depends_on:
      model-runner:
        condition: service_healthy
    environment:
      - MODEL_PROVIDER=vllm
      - VLLM_URL=http://model-runner:8000/v1
      - VLLM_MODEL=ibm-granite/granite-4.1-3b
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - APP_NAME=LangGraph Project
      - APP_VERSION=0.1.0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    ports:
      - "8080:8080"
    command: uv run python -m langgraph_project.main
