services:
  model-runner:
    ports:
      - "12434:12434"
    provider:
      type: model
      options:
        model: hf.co/unsloth/granite-4.0-h-micro-GGUF:UD-Q4_K_XL

  app:
    build: .
    container_name: langgraph-app
    depends_on:
      model-runner:
        condition: service_healthy
    environment:
      - MODEL_PROVIDER=model-runner
      - MODEL_RUNNER_URL=http://model-runner:12434
      - MODEL_RUNNER_MODEL=hf.co/unsloth/granite-4.0-h-micro-GGUF:UD-Q4_K_XL
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - APP_NAME=LangGraph Project
      - APP_VERSION=0.1.0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    ports:
      - "8080:8080"
    command: uv run python -m langgraph_project.main
