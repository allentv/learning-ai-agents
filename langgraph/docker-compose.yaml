services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "12434:12434"
    volumes:
      - ./llamacpp_models:/models
    command: >
      --host 0.0.0.0 --port 12434 --model /models/granite-4.0-h-micro-UD-Q4_K_XL.gguf --ctx-size 4096 --threads 4
    environment:
      - LLAMACPP_MODEL=granite-4.0-h-micro-UD-Q4_K_XL.gguf
      - LLAMACPP_THREADS=4
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:12434/" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: langgraph-api
    ports:
      - "10000:10000"
    volumes:
      - ./api:/app/api
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:10000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-app
    depends_on:
      llamacpp:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - MODEL_PROVIDER=llamacpp
      - LLAMACPP_URL=http://llamacpp:12434/v1
      - OPENAI_API_KEY=llamacpp-dummy-key
      - API_BASE_URL=http://api:10000
      - API_TIMEOUT=30
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - APP_NAME=LangGraph Project
      - APP_VERSION=0.1.0
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    ports:
      - "8080:8080"
    command: uv run python -m langgraph_project.main

volumes:
  model_cache:
