# Mise configuration for LangGraph project
# https://mise.jdx.dev/

[tools]
python = "3.14"

[env]
_.python.venv = ".venv"

[tasks.setup]
description = "Set up the development environment"
run = "uv sync --dev"
hide = false

[tasks.install]
description = "Install dependencies"
run = "uv sync --dev"
hide = false

[tasks.format]
description = "Format code with black and isort"
run = ["uv run black src/ tests/ scripts/", "uv run isort src/ tests/ scripts/"]
hide = false

[tasks.format-check]
description = "Check code formatting"
run = "uv run black --check src/ tests/ scripts/"
hide = false

[tasks.lint]
description = "Lint code with ruff"
run = "uv run ruff check src/ tests/ scripts/"
hide = false

[tasks.lint-fix]
description = "Auto-fix linting issues"
run = "uv run ruff check --fix src/ tests/ scripts/"
hide = false

[tasks.type-check]
description = "Type check with mypy (strict mode)"
run = "uv run mypy --strict src/langgraph_project tests"
hide = false

[tasks.type-check-strict]
description = "Type check with mypy (strict mode + detailed errors)"
run = "uv run mypy --strict --show-error-codes --show-column-numbers src/langgraph_project tests"
hide = false

[tasks.type-check-verbose]
description = "Type check with mypy (verbose output)"
run = "uv run mypy --strict --show-error-codes --show-column-numbers --no-error-summary src/langgraph_project tests"
hide = false

[tasks.test]
description = "Run tests"
run = "uv run pytest"
hide = false

[tasks.test-coverage]
description = "Run tests with coverage"
run = "uv run pytest --cov=src/langgraph_project"
hide = false

[tasks.verify]
description = "Run all checks (format, lint, type-check, test)"
run = [
    "mise run format-check",
    "mise run lint",
    "mise run type-check-strict",
    "mise run test",
]
hide = false

[tasks.clean]
description = "Clean up generated files"
run = [
    "rm -rf .venv",
    "rm -rf __pycache__",
    "rm -rf src/__pycache__",
    "rm -rf tests/__pycache__",
    "rm -rf scripts/__pycache__",
    "rm -rf .pytest_cache",
    "rm -rf .mypy_cache",
    "rm -rf htmlcov",
    "rm -rf .coverage",
]
hide = false

[tasks.run]
description = "Run the main application"
run = "uv run python -m langgraph_project.main"
hide = false

[tasks.ui]
description = "Launch LangGraph Studio UI"
run = "uv run langgraph dev"
hide = false

[tasks.shell]
description = "Activate the virtual environment"
run = "source .venv/bin/activate"
hide = false

[tasks.docs]
description = "Build documentation (placeholder)"
run = "echo 'Documentation build not yet configured'"
hide = false

[tasks.help]
description = "Show available tasks"
run = "mise tasks"
hide = false

[tasks.up]
description = "Start all services (llamacpp + API) in background"
run = "docker compose up -d"
hide = false

[tasks.down]
description = "Stop all services"
run = "docker compose down"
hide = false

[tasks.start]
description = "Spin up everything and run the agent"
run = [
    "echo '🚀 Starting all services...'",
    "docker compose down 2>/dev/null || true",
    "echo '🧹 Cleaning up port 10000 if in use...'",
    "fuser -k 10000/tcp 2>/dev/null || true",
    "docker compose up -d",
    "echo '⏳ Waiting for services to be healthy...'",
    "docker compose exec -T app sh -c 'until curl -sf http://api:10000/health > /dev/null 2>&1; do sleep 1; done' && echo '✅ API is ready' || echo '⚠️  API health check timed out'",
    "echo '🤖 Running agent...'",
    "docker compose exec app uv run python -m langgraph_project.main",
]
hide = false

[tasks.api]
description = "Run the API service locally"
run = "uvicorn api.app:app --host 0.0.0.0 --port 10000 --reload"
hide = false

[tasks.api-test]
description = "Test the API endpoint"
run = [
    "curl -sf http://localhost:10000/health || echo '❌ API not running. Run: mise run api'",
    "curl -sf 'http://localhost:10000/api/search?q=hello' | python -m json.tool || true",
]
hide = false

[tasks.logs]
description = "View docker compose logs"
run = "docker compose logs"
hide = false

[tasks.download-model]
description = "Download GGUF model for llama.cpp"
run = [
    "echo '📥 Downloading GGUF model granite-4.0-h-micro-UD-Q4_K_XL.gguf...'",
    "mkdir -p llamacpp_models",
    "curl -fSL -o 'llamacpp_models/granite-4.0-h-micro-UD-Q4_K_XL.gguf' 'https://huggingface.co/unsloth/granite-4.0-h-micro-GGUF/resolve/main/granite-4.0-h-micro-UD-Q4_K_XL.gguf'",
    "echo '✅ Model downloaded to llamacpp_models/granite-4.0-h-micro-UD-Q4_K_XL.gguf'",
]
hide = false
